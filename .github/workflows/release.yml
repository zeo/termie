name: release

# build, test, and attach Windows and Linux packages when a version tag is pushed
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # bypass the runner's machine-level sccache wrapper, whose server drops
  # connections mid-build (it killed the first v0.3.0 run); Swatinem/rust-cache
  # still caches dependencies between runs
  RUSTC_WRAPPER: ""

jobs:
  release:
    if: github.actor == 'zeo'
    runs-on: [self-hosted, windows-vm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.ROT_INSTALLER_REPOSITORY }}
          path: .rot-installer
          ssh-key: ${{ secrets.ROT_INSTALLER_DEPLOY_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: test
        run: cargo test --locked

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: build (release, LTO)
        run: cargo build --release --locked

      - name: fetch conpty host
        # windows powershell 5.1: the runner image carries no pwsh (the first
        # v0.4.0 run died on "pwsh: command not found"); the script is 5.1-clean
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File setup\fetch-conpty.ps1 -Dest target\release

      - name: build shared installer tools
        shell: powershell
        env:
          TERMIE_INSTALLER_PUBLIC_KEY: ${{ vars.TERMIE_INSTALLER_PUBLIC_KEY }}
        run: |
          cargo build --release --locked --manifest-path .rot-installer\Cargo.toml --bin rot-installer --bin rot-pack
          if ($LASTEXITCODE -ne 0) { throw "shared installer build failed" }

      - name: pack shared installer release
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          $stage = Join-Path $env:RUNNER_TEMP 'termie-payload'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\termie.exe $stage\
          Copy-Item target\release\conpty.dll, target\release\OpenConsole.exe $stage\
          Copy-Item assets $stage\assets -Recurse
          Copy-Item LICENSE-MIT, LICENSE-APACHE, THIRDPARTY.md $stage\
          Set-Content (Join-Path $stage 'VERSION') $ver
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $pack = '.rot-installer\target\release\rot-pack.exe'
          $installer = '.rot-installer\target\release\rot-installer.exe'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool is unavailable" }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_THUMBPRINT)) { throw "certificate thumbprint is unavailable" }
          $timestamp = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          foreach ($file in @('target\release\termie.exe', 'target\release\conpty.dll', 'target\release\OpenConsole.exe')) {
            & $signtool.FullName sign /sha1 $env:CERTIFICATE_THUMBPRINT /fd sha256 /tr $timestamp /td sha256 $file
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $file" }
          }
          Copy-Item target\release\termie.exe $stage\ -Force
          Copy-Item target\release\conpty.dll, target\release\OpenConsole.exe $stage\ -Force
          function Invoke-RotPack {
            & $pack @args
            if ($LASTEXITCODE -ne 0) { throw "rot-pack failed with exit code $LASTEXITCODE" }
          }
          $package = "dist\termie-$ver-windows-x86_64.rpack"
          Invoke-RotPack pack $stage $package --app termie --version $ver
          Invoke-RotPack sign $package "$package.minisig"
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$(Split-Path $package -Leaf)"
          Invoke-RotPack manifest $package dist\installer.json --url $url --signature "$package.minisig" --published-at ([DateTime]::UtcNow.ToString('o')) --target windows-x86_64
          Invoke-RotPack sign dist\installer.json dist\installer.json.minisig
          Invoke-RotPack online $installer "dist\termie-$ver-setup.exe"
          Invoke-RotPack offline $installer $package "$package.minisig" "dist\termie-$ver-offline-setup.exe" --app termie
          foreach ($file in @("dist\termie-$ver-setup.exe", "dist\termie-$ver-offline-setup.exe")) {
            & $signtool.FullName sign /sha1 $env:CERTIFICATE_THUMBPRINT /fd sha256 /tr $timestamp /td sha256 $file
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $file" }
          }

      - name: attach to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/termie-*-setup.exe
            dist/termie-*.rpack
            dist/termie-*.rpack.minisig
            dist/installer.json
            dist/installer.json.minisig
          fail_on_unmatched_files: true

  release-linux:
    needs: release
    runs-on: [self-hosted, linux-vm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.ROT_INSTALLER_REPOSITORY }}
          path: .rot-installer
          ssh-key: ${{ secrets.ROT_INSTALLER_DEPLOY_KEY }}
          persist-credentials: false
      - name: rustup on PATH
        run: |
          cargo_home="${CARGO_HOME:-/cache/cargo}"
          if ! command -v rustup >/dev/null; then
            export CARGO_HOME="$cargo_home"
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none -y
          fi
          export PATH="$cargo_home/bin:$PATH"
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
          echo "$cargo_home/bin" >> "$GITHUB_PATH"
          dirname "$(command -v rustup)" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy
      # the ephemeral linux vms image /usr/bin/rustup without user-level shims,
      # so nothing puts cargo on PATH. ask rustup where the real cargo binary
      # lives and add that toolchain bin dir (plus the shim dir, if it exists)
      - name: cargo on PATH
        run: |
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: system deps
        run: |
          if command -v pkg-config >/dev/null && pkg-config --exists wayland-client xkbcommon x11 && command -v bwrap >/dev/null && command -v unzip >/dev/null && command -v zip >/dev/null; then
            exit 0
          fi
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo timeout 10m apt-get "${apt_options[@]}" update -qq
          sudo timeout 10m apt-get "${apt_options[@]}" install -y -qq pkg-config libwayland-dev libxkbcommon-dev libx11-dev bubblewrap unzip zip
      - name: test
        run: cargo test --locked
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: build
        run: cargo build --release --locked
      - name: build shared installer tools
        env:
          TERMIE_INSTALLER_PUBLIC_KEY: ${{ vars.TERMIE_INSTALLER_PUBLIC_KEY }}
        run: cargo build --release --locked --manifest-path .rot-installer/Cargo.toml --bin rot-installer --bin rot-pack
      - name: package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          root="termie-$ver-linux-x86_64"
          mkdir -p "dist/$root/bin" "dist/$root/share/applications" "dist/$root/share/icons/hicolor/256x256/apps" "dist/$root/share/doc/termie" "dist/$root/share/termie/fonts"
          install -m755 target/release/termie "dist/$root/bin/termie"
          install -m644 packaging/linux/termie.desktop "dist/$root/share/applications/termie.desktop"
          install -m644 assets/icon.png "dist/$root/share/icons/hicolor/256x256/apps/termie.png"
          install -m644 assets/fonts/* "dist/$root/share/termie/fonts/"
          install -m644 LICENSE-MIT LICENSE-APACHE THIRDPARTY.md README.md "dist/$root/share/doc/termie/"
          install -m755 packaging/linux/install.sh packaging/linux/uninstall.sh "dist/$root/"
          tar -C dist -czf "dist/$root.tar.gz" "$root"
      - name: pack shared installer release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          stage="$RUNNER_TEMP/termie-rpack"
          mkdir -p "$stage/assets"
          install -m755 target/release/termie "$stage/termie"
          cp -R assets/. "$stage/assets/"
          install -m644 LICENSE-MIT LICENSE-APACHE THIRDPARTY.md "$stage/"
          pack=.rot-installer/target/release/rot-pack
          installer=.rot-installer/target/release/rot-installer
          package="dist/termie-$ver-linux-x86_64.rpack"
          "$pack" pack "$stage" "$package" --app termie --version "$ver"
          "$pack" sign "$package" "$package.minisig"
          curl --proto '=https' --tlsv1.2 --retry 5 --location --fail \
            -o dist/installer.json \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/installer.json"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$package")"
          "$pack" manifest "$package" dist/installer.json --url "$url" --signature "$package.minisig" --published-at "$(date --utc --iso-8601=seconds)" --target linux-x86_64
          "$pack" sign dist/installer.json dist/installer.json.minisig
          "$pack" online "$installer" "dist/termie-$ver-linux-x86_64-setup"
          "$pack" offline "$installer" "$package" "$package.minisig" "dist/termie-$ver-linux-x86_64-offline-setup" --app termie
          chmod 755 dist/termie-*-setup
      - name: attach to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/termie-*-linux-x86_64.tar.gz
            dist/termie-*.rpack
            dist/termie-*.rpack.minisig
            dist/termie-*-setup
            dist/installer.json
            dist/installer.json.minisig
          overwrite_files: true
          fail_on_unmatched_files: true
